StylesPath = .vale/styles
MinAlertLevel = warning
; Pinned deliberately. A bare `Packages = Google` resolves to whatever release the
; feed serves at `vale sync` time, so the corpus moves underneath baseline.json and
; findings appear as NEW without a word of prose changing. Note the project also
; moved errata-ai -> vale-cli. Bump this URL on purpose, and reseed in the same change.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip
; Corosio domain vocabulary: .vale/styles/config/vocabularies/Corosio/accept.txt.
; It holds genuine prose words and proper nouns ONLY. Bare C++ identifiers used as
; running text stay unlisted on purpose — they are style-guide B1 defects and must
; keep showing up as Vale.Spelling alerts until the prose is fixed.
Vocab = Corosio
[*.adoc]
BasedOnStyles = Vale, Google, Corosio
; NO BlockIgnores here, on purpose. Vale's native AsciiDoc handling (it shells out to
; asciidoctor and only lints extracted prose nodes) already excludes delimited listing
; blocks — `[source,cpp]`/`----`, bare `----`, `....` literal blocks, blocks nested in
; list items or admonitions, `role=pseudocode`/`role=external`, and callout markers are
; all skipped natively. A `BlockIgnores = (?s) *(\[source.*?----.*?----)` substitution
; does NOT additionally protect anything — it destroys the `----` delimiters before
; asciidoctor sees them, which corrupts the block structure and hands the code inside to
; the linter as if it were a paragraph. That was measured on Capy's corpus, where
; removing the line dropped `.adoc` warning-level alerts 503 -> 376; Corosio inherits the
; decision rather than re-deriving it. If you are tempted to add a BlockIgnores line for
; source blocks: don't. Confirm first, with an isolated fixture, that Vale is actually
; failing to skip something.
;
; One Vale/asciidoctor artifact to know about before chasing a missing alert: a
; correctly-excluded code block can suppress an UNRELATED, later Vale.Spelling or
; Google.Colons alert when the block's own text shares a SUBSTRING with the flagged word,
; and only when the block sits BEFORE the flagged prose in the file. Reduced fixture:
; `// token` before a paragraph containing `foo_token` suppresses the alert; `// hello`
; before it does not. This is a position-resolution artifact, not something any
; BlockIgnores/TokenIgnores value controls — do not try to "fix" it with a config change
; without a bite-tested fixture proving the change does something.
;
; Ignore inline code spans (backticks) AND `cpp:target[...]` reference macros: the B1
; conversion replaces backtick symbol spans with cpp: macros, and their symbol text must
; stay unlinted, exactly as the backtick spans were.
;
; The third clause is the fixed label of the boost-wide thread-safety idiom
; ("Distinct objects: Safe." / "Shared objects: Unsafe."). Each instance is a genuine
; Google.Colons hit, but the form is boost-wide and Corosio does not get to rewrite it;
; `grep -ro '\(Distinct\|Shared\) objects:' --include='*.hpp' include` reports 72, spread
; over io_context, resolver_results, endpoint, signal_set, tcp_acceptor, the TLS streams
; and others. Only the LABEL and its colon are blanked, so whatever follows stays fully
; linted by every other rule; the pattern deliberately does NOT spell out "Safe."/
; "Unsafe." because instances continue into longer clauses that a phrase-exact form would
; leave exposed while suppressing its siblings.
; This is NOT a Google.Colons demotion, on purpose: demoting the rule would also hide the
; genuine non-idiom Colons hits.
TokenIgnores = (\x60[^\x60]+\x60), (cpp:[^\s\[]*\[[^\]]*\]), ((?:Distinct|Shared) objects:)

; --- Google house-style pack: deliberately demoted, not abandoned ----------------
; These eight rules encode GOOGLE's house style, not Corosio defects, and are scoped out
; of the "vale clean" criterion. They are demoted to `suggestion` (below MinAlertLevel)
; rather than removed, so a curious reader can still run
; `vale --minAlertLevel=suggestion` and see them. Counts below are measured on Corosio's
; two corpora at the port commit — `.adoc` = doc/modules, docstrings =
; lint/.docstrings — and are the same ruling Capy made, re-measured here rather than
; inherited.
;
; Google.Headings — Corosio writes Title Case section headings; Google style mandates
;   sentence case. Retitling every heading is a user-visible house-style change, not a
;   defect fix.
; Google.WordListCase — Google's capitalisation list for words like "Internet"/"email";
;   disagrees with Boost usage, not with Part C. Note Corosio's networking tutorial uses
;   "Internet" heavily, so this rule is noisier here than in Capy.
; Google.EmDash — bans spaced em dashes. Corosio uses ` -- ` (AsciiDoc's em-dash form) as
;   a deliberate typographic convention.
; Google.We / Google.FirstPerson — ban first-person. The tutorial and design prose
;   address the reader directly by design (D1/D3).
; Google.Latin — bans "e.g."/"i.e."; both are standard in Boost reference documentation.
; Google.Quotes — demands commas and periods inside quotation marks (US convention).
;   Corosio quotes code-like strings, where moving punctuation inside the quotes would
;   misstate the string's contents.
; Google.Spacing — flags spacing around punctuation in prose that is mostly quoted code.
;
; NOT demoted, on purpose: Google.Will (a genuine C4 signal, and C4 is gated),
; Google.Colons, Google.OxfordComma, Google.LyHyphens, Google.Units, Google.Ordinal.
;
; Google.LyHyphens misfires on Corosio's `family-*` compounds -- `family-neutral`,
; `family-sensitive`, `family-generic`, `family-specific`. The rule targets adverb
; hyphenation (`newly-created`) and matches these only because "family" ends in "ly".
; The hyphens are correct: they are compound adjectives, not adverbs. The rule stays
; un-demoted because it catches the real thing elsewhere, so this bounded set of false
; positives is carried in baseline.json instead -- grandfathered on purpose, not by
; accident. Re-check it if the `family-*` vocabulary grows.
Google.Headings = suggestion
Google.WordListCase = suggestion
Google.EmDash = suggestion
Google.We = suggestion
Google.FirstPerson = suggestion
Google.Latin = suggestion
Google.Quotes = suggestion
Google.Spacing = suggestion
