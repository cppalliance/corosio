site:
  title: Boost.Corosio
  url: https://antora.cppalliance.org/develop/lib/doc
  start_page: corosio::index.adoc
  robots: allow
  keys:
    repo_url: 'https://github.com/cppalliance/corosio'

content:
  sources:
    - url: ..
      start_path: doc
      edit_url: 'https://github.com/cppalliance/corosio/edit/develop/{path}'

ui:
  bundle:
    url: https://github.com/boostorg/website-v2-docs/releases/download/ui-develop/ui-bundle.zip
    snapshot: true

antora:
  extensions:
    - require: '@antora/collector-extension'
    - require: '@cppalliance/antora-cpp-tagfiles-extension'
      cpp-tagfiles:
        using-namespaces:
          - 'boost::'
    - require: '@cppalliance/antora-cpp-reference-extension'
      # Deliberately NO `version` key. The reference examples are injected by
      # doc/addons/extensions/reference-snippets.lua, which needs MrDocs'
      # extension API -- not in any tagged release (corpus transforms shipped in
      # cppalliance/mrdocs#1196), after v0.8.0. The docs workflow therefore
      # installs a develop build with that extension copied in and points here
      # via MRDOCS_ROOT, which is the real pin.
      #
      # Setting `version` DEFEATS that: a local install reports its version as
      # `0.8.0+<sha>`, which can never satisfy "develop", so the extension
      # rejects MRDOCS_ROOT and downloads its own copy -- one without the
      # extension, which then renders the reference with no examples at all.
      dependencies:
        - name: 'boost'
          repo: 'https://github.com/boostorg/boost.git'
          tag: 'develop'
          variable: 'BOOST_SRC_DIR'
          system-env: 'BOOST_SRC_DIR'
    - require: '@cppalliance/antora-downloads-extension'

asciidoc:
  attributes:
    # Enable pagination
    page-pagination: ''
  extensions:
    - '@cppalliance/asciidoctor-boost-links'
    - '@asciidoctor/tabs'
