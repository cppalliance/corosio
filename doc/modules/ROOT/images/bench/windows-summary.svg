<style>.bch-chart{width:100%;height:auto;overflow:visible}.imageblock.bch-block{align-items:stretch}.imageblock.bch-block .content{width:100%}.bch-seg-label{fill:#ffffff;font-weight:700}html.dark .bch-exact>summary.title,html.dark .bch-exact summary.title{color:var(--text-main-text-primary,#ffffff)}.boostlook .doc .openblock.bch-card{border:1px solid var(--border-border-secondary,#e3e2dc);border-radius:10px;padding:14px 14px 4px;margin-top:1.4rem;margin-bottom:1.4rem}.boostlook .doc .bch-card .imageblock.bch-block{margin-top:0;margin-bottom:0.25rem}.boostlook .doc .bch-card details.bch-exact{margin-top:0;margin-bottom:0.5rem;margin-left:0}.boostlook .doc .bch-card details.bch-exact>summary{margin-left:2rem}.boostlook .doc .bch-card table.stretch,.boostlook #content .bch-card table.stretch{width:100%;margin-left:0;font-size:0.88em}.boostlook .doc .bch-card table.stretch td,.boostlook .doc .bch-card table.stretch th{padding:0.3rem 0.55rem}@media (prefers-color-scheme: dark) {.bch-surface{fill:#1a1a19}.bch-ink{fill:#ffffff}.bch-ink2{fill:#c3c2b7}.bch-grid{stroke:#3a3a38}.bch-zero{stroke:#c3c2b7}.bch-s-native{fill:#3987e5}.bch-s-uring{fill:#d95926}.bch-s-cb{fill:#199e70}.bch-div-pos{fill:#3987e5}.bch-div-neg{fill:#e66767}.bch-div-mid{fill:#383835}}html:not(.dark) .bch-surface{fill:transparent}html:not(.dark) .bch-ink{fill:#1f1f1e}html:not(.dark) .bch-ink2{fill:#5f5e58}html:not(.dark) .bch-grid{stroke:#e3e2dc}html:not(.dark) .bch-zero{stroke:#5f5e58}html:not(.dark) .bch-s-native{fill:#2a78d6}html:not(.dark) .bch-s-uring{fill:#eb6834}html:not(.dark) .bch-s-cb{fill:#1baf7a}html:not(.dark) .bch-div-pos{fill:#2a78d6}html:not(.dark) .bch-div-neg{fill:#e34948}html:not(.dark) .bch-div-mid{fill:#f0efec}html.dark .bch-surface{fill:transparent}html.dark .bch-ink{fill:#ffffff}html.dark .bch-ink2{fill:#c3c2b7}html.dark .bch-grid{stroke:#3a3a38}html.dark .bch-zero{stroke:#c3c2b7}html.dark .bch-s-native{fill:#3987e5}html.dark .bch-s-uring{fill:#d95926}html.dark .bch-s-cb{fill:#199e70}